name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 evals/test_run.py
      - run: python3 tools/test_check_quotes.py
      - run: python3 tools/check_index.py
      - run: python3 -I tools/seat.py check
      - run: python3 .github/check-skills.py plugin/skills/hire plugin/board --agents plugin/staff/agents/*.md
      - run: bash -n install.sh
      - run: bash test_install.sh
