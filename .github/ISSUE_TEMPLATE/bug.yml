name: Bug
description: Something does not work.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps or command
  - type: input
    id: env
    attributes:
      label: Agent, model and OS
